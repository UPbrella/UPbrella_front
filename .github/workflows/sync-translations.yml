name: Sync Translations from Google Sheets

on:
  repository_dispatch:
    types: [translation-update]
  workflow_dispatch:
    inputs:
      target_branch:
        description: "checkout할 브랜치 (테스트: develop, 운영: release)"
        default: "release"
        type: string

env:
  GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'release' }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Download translations CSV from Google Sheets
        run: curl -L -o translations.csv "$GOOGLE_SHEET_CSV_URL"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate i18n JSON from CSV
        run: pnpm run i18n:generate

      - name: Check for translation changes
        id: changes
        run: git diff --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"

      # 브랜치 보호(PR 필수)로 직접 push 불가 → 번역 브랜치 push 후 PR 생성
      - name: Open PR with updated translations
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/sync-translations-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add translations.csv src/shared/lib/i18n/locales/
          git commit -m "[chore] Sync translations from Google Sheets"
          git push origin "$BRANCH"
          gh pr create --base "$TARGET_BRANCH" --head "$BRANCH" \
            --title "[chore] Sync translations from Google Sheets" \
            --body "Google Sheets 번역 동기화 (run ${{ github.run_id }})"
